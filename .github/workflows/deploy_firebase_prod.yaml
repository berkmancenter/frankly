name: Deploy Firebase Components to Production
concurrency: production
on: workflow_dispatch

jobs:
  deploy_firebase_prod:
    name: Deploy Firebase Components to Production
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install NPM Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./firebase/functions/package-lock.json
      - run: npm ci

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2" # could read version from pubspec file, but would need to be exact
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-path: "/home/runner/.pub-cache" #hardcoded not ideal, but no way to reference $HOME

      - name: Install Dart Dependencies
        run: flutter pub get

      - name: Sync index.html template for functions-ts temp directory
        working-directory: firebase/functions-ts
        run: mkdir -p web && cp ../../client/web/index.html web/index.html

      - name: Build Functions
        run: dart run build_runner build --output=build

      # firebase/functions-ts (Node v24, v2)
      - name: Setup Node for functions-ts
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./firebase/functions-ts/package-lock.json

      - name: Install functions-ts Dependencies
        working-directory: firebase/functions-ts
        run: npm ci

      - name: Build functions-ts
        working-directory: firebase/functions-ts
        run: npm run build

      - name: Deploy Rules and Indexes
        uses: w9jds/firebase-action@v13.22.1
        with:
          args: deploy --only firestore:rules,firestore:indexes --force
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.APP_PROD_PROJECT_ID }}

      - name: Build Deployment Command
        id: build-deployment-cmd
        uses: jencompgeek/firebase-function-mapper@main
        with:
          force: true
          mapping-file: ${{ github.workspace }}/.github/workflows/function-mapping.json

      # w9jds/setup-firebase (not w9jds/firebase-action) so firebase-tools runs
      # under the job's own Node (24, set up above for functions-ts) instead of
      # firebase-action's Docker image, which is fixed to Node 20,
      - name: Setup Firebase CLI
        uses: w9jds/setup-firebase@main
        with:
          tools-version: 13.22.1
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.APP_PROD_PROJECT_ID }}

      - name: Deploy Functions
        run: |
          firebase functions:config:set "${{ secrets.FIREBASE_CONFIG }}"
          ${{ steps.build-deployment-cmd.outputs.deploy-command }}
