name: Deploy Firebase Components to Staging
concurrency: staging
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      function-names:
        required: false
        description: "A space-separated list of firebase function names to deploy"
      groups:
        required: false
        description: "A space-separated list of firebase function groups to deploy"

jobs:
  deploy_firebase_staging:
    name: Deploy Firebase to Staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          list-files: shell
          filters: |
            functions:
              - 'firebase/functions/js/**'
              - 'firebase/functions/lib/**'
              - 'client/web/index.html'
            functions_ts:
              - 'firebase/functions-ts/**'
              - 'client/web/index.html'
            firestore:
              - 'firebase/firestore/**'
            shared:
              - 'data_models/lib/**'
              - 'firebase/functions/lib/utils/infra/firestore_utils.dart'
              - 'firebase/functions/lib/utils/infra/firebase_auth_utils.dart'
              - 'firebase/functions/lib/utils/utils.dart'

      - name: Setup Node
        if: steps.changes.outputs.functions == 'true' || github.event_name== 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./firebase/functions/package-lock.json

      - name: Install NPM Dependencies
        if: steps.changes.outputs.functions == 'true' || github.event_name== 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        run: npm ci

      - name: Set Up Flutter
        if: steps.changes.outputs.functions == 'true' || github.event_name== 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2" # could read version from pubspec file, but would need to be exact
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-path: "/home/runner/.pub-cache" #hardcoded not ideal, but no way to reference $HOME

      - name: Install Dart Dependencies
        if: steps.changes.outputs.functions == 'true' || github.event_name== 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        run: flutter pub get

      - name: Build Functions
        if: steps.changes.outputs.functions == 'true' || github.event_name== 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        run: dart run build_runner build --output=build

      # firebase/functions-ts (Node 24, Gen2) - ServeIndex's index.html template
      # lives under its own web/ dir now (not the Dart codebase's), since the
      # Dart side no longer serves it at all.
      #
      # This step always runs because every
      # deploy step below needs Node 24 action.
      - name: Setup Node for functions-ts
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./firebase/functions-ts/package-lock.json

      - name: Install functions-ts Dependencies
        if: steps.changes.outputs.functions_ts == 'true' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        working-directory: firebase/functions-ts
        run: npm ci

      - name: Sync index.html template for functions-ts
        if: steps.changes.outputs.functions_ts == 'true' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        working-directory: firebase/functions-ts
        run: mkdir -p web && cp ../../client/web/index.html web/index.html

      - name: Build functions-ts
        if: steps.changes.outputs.functions_ts == 'true' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        working-directory: firebase/functions-ts
        run: npm run build

      - name: Deploy Rules and Indexes
        if: steps.changes.outputs.firestore == 'true' || github.event_name== 'workflow_dispatch'
        uses: w9jds/firebase-action@v13.22.1
        with:
          args: deploy --only firestore:rules,firestore:indexes --force
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.APP_STAGING_PROJECT_ID }}

      - name: Build Deployment Command
        if: (steps.changes.outputs.functions == 'true' || steps.changes.outputs.functions_ts == 'true') && github.event_name == 'push' && steps.changes.outputs.shared == 'false'
        id: build-deployment-cmd
        uses: jencompgeek/firebase-function-mapper@main
        with:
          force: true
          mapping-file: ${{ github.workspace }}/.github/workflows/function-mapping.json
          files: ${{ steps.changes.outputs.functions_files }} ${{ steps.changes.outputs.functions_ts_files }}

      # w9jds/setup-firebase (not w9jds/firebase-action) so firebase-tools runs
      # under the job's own Node (set to 24 above)
      - name: Setup Firebase CLI
        if: (steps.changes.outputs.functions == 'true' || steps.changes.outputs.functions_ts == 'true') && github.event_name == 'push' && steps.changes.outputs.shared == 'false'
        uses: w9jds/setup-firebase@main
        with:
          tools-version: 14.25.0
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.APP_STAGING_PROJECT_ID }}

      - name: Deploy Functions
        if: (steps.changes.outputs.functions == 'true' || steps.changes.outputs.functions_ts == 'true') && github.event_name == 'push' && steps.changes.outputs.shared == 'false'
        run: |
          firebase functions:config:set "${{ secrets.FIREBASE_CONFIG }}"
          ${{ steps.build-deployment-cmd.outputs.deploy-command }}

        # Updates to the data model or widely used utils should deploy all functions.
        # functions-ts function names in `groups`/`files` entries are qualified
        # as `functions-ts:<name>` (see function-mapping.json), so this path
        # correctly resolves and deploys them alongside the Dart codebase.
      - name: Build Deployment Command for Workflow Dispatch or Shared Code Update
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        id: build-deployment-cmd-manual
        uses: jencompgeek/firebase-function-mapper@main
        with:
          force: true
          mapping-file: ${{ github.workspace }}/.github/workflows/function-mapping.json
          names: ${{ inputs.function-names }}
          groups: ${{ inputs.groups}}

      - name: Setup Firebase CLI for Workflow Dispatch or Shared Code Update
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        uses: w9jds/setup-firebase@main
        with:
          tools-version: 14.25.0
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.APP_STAGING_PROJECT_ID }}

      - name: Deploy Functions for Workflow Dispatch or Shared Code Update
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.shared == 'true'
        run: |
          firebase functions:config:set "${{ secrets.FIREBASE_CONFIG }}"
          ${{ steps.build-deployment-cmd-manual.outputs.deploy-command }}
