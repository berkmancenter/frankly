name: Cache Bust Client
# Shares the deploy concurrency group so a normal deploy cannot race it.
concurrency: ${{ inputs.environment }}
# Builds and deploys the client with a new cache_epoch.json token. Every
# client that loads the site afterwards sees the changed token and clears its
# caches and service workers once. Later normal deploys carry the token over
# unchanged. For production, run this on the tag that is currently live.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

jobs:
  cache_bust_client:
    name: Cache Bust Client (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Require Tag Ref for Production
        if: inputs.environment == 'production' && github.ref_type != 'tag'
        run: |
          echo "::error::Production cache bust must run on a release tag."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-path: "/home/runner/.pub-cache"

      - name: Install Dependencies
        run: flutter pub get

      - name: Update Product Version
        env:
          VERSION: ${{ inputs.environment == 'production' && github.ref_name || github.sha }}
        # Literal replace so ref name can't reach shell or regex.
        run: |
          perl -pi -e 's/__VERSION__/$ENV{VERSION}/g' "${{ github.workspace }}/client/web/index.html"

      - name: Update Google Auth Client ID
        run: |
          sed -i 's/__GOOGLE_ID__/${{ secrets.GOOGLE_SIGN_IN_ID }}/g' ${{ github.workspace }}/client/web/index.html

      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          envkey_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          envkey_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          envkey_FIREBASE_PROJECT_ID: ${{ inputs.environment == 'production' && secrets.APP_PROD_PROJECT_ID || secrets.APP_STAGING_PROJECT_ID }}
          envkey_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          envkey_FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          envkey_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          envkey_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          envkey_FUNCTIONS_URL_PREFIX: ${{ secrets.FUNCTIONS_URL_PREFIX }}
          envkey_SHARE_LINK_URL: ${{ inputs.environment == 'production' && secrets.APP_FULL_URL || secrets.APP_STAGING_FULL_URL }}/share
          envkey_AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          envkey_ENABLE_FAKE_PARTICIPANTS: ${{ inputs.environment == 'staging' }}
          envkey_ENABLE_DEV_EVENT_SETTINGS: ${{ inputs.environment == 'staging' }}
          envkey_ENABLE_DEV_ADMIN_SETTINGS: ${{ inputs.environment == 'staging' }}
          envkey_ENABLE_TRACE_LOG: ${{ inputs.environment == 'staging' }}
          envkey_SENTRY_RELEASE: ${{ inputs.environment == 'production' && github.ref_name || github.sha }}
          envkey_SENTRY_ENVIRONMENT: ${{ inputs.environment }}
          envkey_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          envkey_MATOMO_URL: ${{ secrets.MATOMO_URL }}
          envkey_MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
          envkey_APP_NAME: Frankly
          envkey_APP_URL: https://app.frankly.org
          envkey_TERMS_URL: https://frankly.org/terms
          envkey_PRICING_URL: https://frankly.org/pricing
          envkey_ABOUT_URL: https://frankly.org
          envkey_PRIVACY_POLICY_URL: https://frankly.org/privacy
          envkey_HELP_CENTER_URL: https://rebootingsocialmedia.notion.site/Frankly-Help-Center-23b4f9a120a344d4af2b2ce44b2ae229
          envkey_HELP_CENTER_MANAGING_COMMUNITY_URL: https://rebootingsocialmedia.notion.site/Managing-your-Community-d29e7832b9434cc7981d420d62730043
          envkey_CREATE_TEMPLATE_HELP_URL: https://rebootingsocialmedia.notion.site/Creating-and-Managing-Events-552a42e4a09549b788e1901536a25965
          envkey_CREATE_EVENT_HELP_URL: https://rebootingsocialmedia.notion.site/Creating-and-Managing-Events-552a42e4a09549b788e1901536a25965
          envkey_TROUBLESHOOTING_GUIDE_URL: https://rebootingsocialmedia.notion.site/Troubleshooting-c6f922b816a742a9bba4bf000e84565d
          envkey_LOGO_URL: https://res.cloudinary.com/dh0vegjku/image/upload/v1725488238/frankly_assets/Frankly-Icon-144x144_ex8nky.png
          envkey_SIDEBAR_FOOTER: "Frankly is operated by the Applied Social Media Lab at the Berkman Klein Center for Internet & Society"
          envkey_COPYRIGHT_STATEMENT: "President and Fellows of Harvard College."
          envkey_CLOUDINARY_IMAGE_PRESET: ${{ secrets.CLOUDINARY_IMAGE_PRESET }}
          envkey_CLOUDINARY_VIDEO_PRESET: ${{ secrets.CLOUDINARY_VIDEO_PRESET }}
          envkey_CLOUDINARY_DEFAULT_PRESET: ${{ secrets.CLOUDINARY_DEFAULT_PRESET }}
          envkey_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          envkey_LINK_PREVIEW_API_KEY: ${{ secrets.LINK_PREVIEW_API_KEY }}
          envkey_SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          envkey_BYPASS_EMAIL_VERIFICATION: ${{ secrets.BYPASS_EMAIL_VERIFICATION }}

      - name: Build the Flutter App
        run: flutter build web --release --web-renderer html -t lib/main.dart --dart-define-from-file=${{ github.workspace }}/.env

      - name: Write New Cache Epoch
        run: |
          jq -nc --arg t "${{ github.run_id }}-${{ github.run_attempt }}" '{token: $t}' > build/web/cache_epoch.json
          cat build/web/cache_epoch.json

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v13.22.1
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ inputs.environment == 'production' && secrets.APP_PROD_PROJECT_ID || secrets.APP_STAGING_PROJECT_ID }}
